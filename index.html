<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黒板カメラアプリ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; background-color: white; }
        textarea { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: sans-serif; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; background: white; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        .checkbox-group input { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-size: 16px; }

        .history-container { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
        .history-btn { background-color: #e0e0e0; border: 1px solid #ccc; padding: 5px 10px; border-radius: 4px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .delete-history { color: red; font-weight: bold; margin-left: 5px; cursor: pointer; }
        
        button { width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        #okButton { background-color: #007bff; }
        #editButton { background-color: #17a2b8; }
        #restoreButton { background-color: #ffc107; color: #333; }
        #clearButton { background-color: #6c757d; }
        
        #resultContainer { margin-top: 20px; text-align: center; }

        /* 超軽量のための「仮表示用」黒板スタイル（CSSで瞬時に描画） */
        .preview-container { 
            display: none; 
            width: 100%; 
            background-color: #004d25; 
            color: white; 
            border-radius: 4px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            overflow: hidden;
            margin-top: 10px;
        }
        .preview-layout {
            display: flex;
            width: 100%;
            aspect-ratio: 1.35 / 1; 
        }
        .preview-board {
            width: 26%; 
            padding: 3% 2%;
            text-align: left;
            font-size: 3vw; 
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
            word-break: break-all;
            white-space: pre-wrap; 
            position: relative;
        }
        .preview-board-item {
            margin-bottom: 6%;
        }
        .preview-board-title {
            color: #fff;
            opacity: 0.9;
        }
        .preview-board-text {
            color: #fff;
            padding-left: 2px;
        }
        .preview-board-date {
            position: absolute;
            bottom: 3%;
            right: 5%;
            font-size: 2.2vw;
            opacity: 0.9;
        }
        .preview-photo-area {
            width: 74%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-photo {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }
        
        canvas { display: none; }
        .hidden-input { display: none !important; }
    </style>
</head>
<body>

    <h2>黒板カメラアプリ</h2>
    
    <div class="form-group">
        <label for="photographer">撮影者名</label>
        <input type="text" id="photographer" placeholder="例：○○株式会社 山田" oninput="updateFastPreview()">
        <div id="photographerHistory" class="history-container"></div>
    </div>

    <div class="form-group">
        <label for="areaSelect">エリア選択</label>
        <select id="areaSelect" onchange="updatePropertyOptions(); updateFastPreview();">
            <option value="">-- エリアを選択してください --</option>
            <option value="市内">市内</option>
            <option value="東大阪">東大阪</option> 
        </select>
    </div>

    <div class="form-group">
        <label for="propertySelect">物件略称（リストから選択）</label>
        <select id="propertySelect" onchange="togglePropertyInput(); updateFastPreview();" disabled>
            <option value="">-- 先にエリアを選択してください --</option>
        </select>
        <input type="text" id="property" placeholder="物件略称を手入力" style="margin-top: 5px; display: none;" oninput="updateFastPreview()">
    </div>

    <div class="form-group">
        <label for="location">撮影現場</label>
        <input type="text" id="location" placeholder="例：2階 リビング" oninput="updateFastPreview()">
    </div>

    <div class="form-group">
        <label for="detail">詳細（自由に改行できます）</label>
        <textarea id="detail" rows="3" placeholder="例：状況&#10;寸法&#10;処置" oninput="updateFastPreview()"></textarea>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="showDateCheck" checked onchange="updateFastPreview()">
        <label for="showDateCheck">黒板に撮影日時を入れる</label>
    </div>

    <button id="okButton">OK（新規カメラ撮影）</button>
    <button id="editButton">編集（既存の画像を選択して黒板上書き）</button>
    <button id="restoreButton">直前に入力した内容を呼び出す</button>
    <button id="clearButton">入力欄をすべてクリア</button>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden-input">
    <input type="file" id="editFileInput" accept="image/*" class="hidden-input">

    <div id="resultContainer">
        <p id="statusText"></p>
        
        <div id="previewContainer" class="preview-container">
            <div class="preview-layout">
                <div class="preview-board">
                    <div class="preview-board-item"><span class="preview-board-title">撮影者：</span><br><span id="viewPhotographer" class="preview-board-text"></span></div>
                    <div class="preview-board-item"><span class="preview-board-title">物件略称：</span><br><span id="viewProperty" class="preview-board-text"></span></div>
                    <div class="preview-board-item"><span class="preview-board-title">撮影現場：</span><br><span id="viewLocation" class="preview-board-text"></span></div>
                    <div class="preview-board-item"><span class="preview-board-title">詳細：</span><br><span id="viewDetail" class="preview-board-text"></span></div>
                    <div id="viewDate" class="preview-board-date"></div>
                </div>
                <div class="preview-photo-area">
                    <img id="previewPhoto" class="preview-photo" alt="撮影された写真">
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const okButton = document.getElementById('okButton');
        const editButton = document.getElementById('editButton');
        const restoreButton = document.getElementById('restoreButton');
        const clearButton = document.getElementById('clearButton');
        const cameraInput = document.getElementById('cameraInput');
        const editFileInput = document.getElementById('editFileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewPhoto = document.getElementById('previewPhoto');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let currentOriginalImageSrc = null;
        let isEditMode = false; 
        let currentGeneratedDateText = ""; 

        // --- 物件データの定義 ---
        const propertyData = {
            "市内": ["北堀江", "難波", "京町堀", "靱本町", "本町橋", "上本町", "BG鶴見", "SV東淀川"],
            "東大阪": ["高井田", "E長堂", "BS華", "A小阪", "P小阪", "Aカジュアル", "GS八戸ノ里", "八戸ノ里"]
        };

        function updatePropertyOptions() {
            const areaSelect = document.getElementById('areaSelect');
            const propertySelect = document.getElementById('propertySelect');
            const propertyInput = document.getElementById('property');
            const selectedArea = areaSelect.value;
            
            propertySelect.innerHTML = '';
            propertyInput.style.display = 'none';
            propertyInput.value = '';

            if (!selectedArea) {
                propertySelect.innerHTML = '<option value="">-- 先にエリアを選択してください --</option>';
                propertySelect.disabled = true;
                return;
            }

            propertySelect.disabled = false;
            let optionsHtml = '<option value="">-- 物件を選択してください --</option>';
            propertyData[selectedArea].forEach(name => {
                optionsHtml += `<option value="${name}">${name}</option>`;
            });
            optionsHtml += '<option value="__CUSTOM__">その他（手入力）</option>';
            propertySelect.innerHTML = optionsHtml;
        }

        function togglePropertyInput() {
            const select = document.getElementById('propertySelect');
            const input = document.getElementById('property');
            if (select.value === "__CUSTOM__") {
                input.style.display = "block";
                input.value = "";
            } else {
                input.style.display = "none";
                input.value = select.value; 
            }
        }

        // 高速・軽量なHTMLベースの仮表示アップデート処理
        function updateFastPreview() {
            if (!currentOriginalImageSrc) return;

            document.getElementById('viewPhotographer').innerText = document.getElementById('photographer').value;
            document.getElementById('viewProperty').innerText = document.getElementById('property').value;
            document.getElementById('viewLocation').innerText = document.getElementById('location').value;
            document.getElementById('viewDetail').innerText = document.getElementById('detail').value;

            const dateDiv = document.getElementById('viewDate');
            if (document.getElementById('showDateCheck').checked && currentGeneratedDateText) {
                dateDiv.innerText = currentGeneratedDateText;
                dateDiv.style.display = 'block';
            } else {
                dateDiv.style.display = 'none';
            }
            
            previewContainer.style.display = 'block';
            statusText.innerText = "入力欄を編集すると写真に反映できます";
            
            // 入力中に裏側でも常に本番合成を静かに走らせておき、Canvas側も最新に同期させます
            generateFinalCanvasSilently();
        }

        // --- 撮影者名の履歴管理処理 ---
        let photographerList = JSON.parse(localStorage.getItem('photographerHistory')) || [];

        function updateHistoryUI() {
            const container = document.getElementById('photographerHistory');
            container.innerHTML = '';
            photographerList.forEach((name, index) => {
                const btn = document.createElement('span');
                btn.className = 'history-btn';
                btn.innerHTML = `${name} <span class="delete-history" onclick="deleteHistory(${index}, event)">❌</span>`;
                btn.addEventListener('click', function() {
                    document.getElementById('photographer').value = name;
                    updateFastPreview(); 
                });
                container.appendChild(btn);
            });
        }

        function savePhotographer(name) {
            if (!name) return;
            photographerList = photographerList.filter(item => item !== name); 
            photographerList.unshift(name); 
            if (photographerList.length > 5) photographerList.pop(); 
            localStorage.setItem('photographerHistory', JSON.stringify(photographerList));
            updateHistoryUI();
        }

        function deleteHistory(index, event) {
            event.stopPropagation(); 
            photographerList.splice(index, 1);
            localStorage.setItem('photographerHistory', JSON.stringify(photographerList));
            updateHistoryUI();
        }

        updateHistoryUI();

        // --- 入力内容を保存・復元する処理 ---
        function saveCurrentInputs() {
            const inputs = {
                photographer: document.getElementById('photographer').value,
                area: document.getElementById('areaSelect').value,
                propertySelect: document.getElementById('propertySelect').value,
                propertyRaw: document.getElementById('property').value,
                location: document.getElementById('location').value,
                detail: document.getElementById('detail').value,
                showDate: document.getElementById('showDateCheck').checked
            };
            localStorage.setItem('lastFormInputs', JSON.stringify(inputs));
        }

        restoreButton.addEventListener('click', function() {
            const savedData = localStorage.getItem('lastFormInputs');
            if (!savedData) {
                alert('直前の入力データが見つかりません。');
                return;
            }
            
            const inputs = JSON.parse(savedData);
            document.getElementById('photographer').value = inputs.photographer || '';
            document.getElementById('areaSelect').value = inputs.area || '';
            
            updatePropertyOptions();
            
            if (inputs.propertySelect) {
                document.getElementById('propertySelect').value = inputs.propertySelect;
                if (inputs.propertySelect === '__CUSTOM__') {
                    document.getElementById('property').style.display = 'block';
                    document.getElementById('property').value = inputs.propertyRaw || '';
                } else {
                    document.getElementById('property').style.display = 'none';
                    document.getElementById('property').value = inputs.propertySelect;
                }
            }
            
            document.getElementById('location').value = inputs.location || '';
            document.getElementById('detail').value = inputs.detail || '';
            if (inputs.hasOwnProperty('showDate')) {
                document.getElementById('showDateCheck').checked = inputs.showDate;
            }
            
            updateFastPreview(); 
        });

        // --- オールクリアボタンの処理 ---
        clearButton.addEventListener('click', function() {
            if (confirm('入力された内容をすべて消去しますか？')) {
                saveCurrentInputs();
                
                document.getElementById('photographer').value = '';
                document.getElementById('areaSelect').value = '';
                document.getElementById('propertySelect').innerHTML = '<option value="">-- 先にエリアを選択してください --</option>';
                document.getElementById('propertySelect').disabled = true;
                document.getElementById('property').value = '';
                document.getElementById('property').style.display = 'none';
                document.getElementById('location').value = '';
                document.getElementById('detail').value = '';
                document.getElementById('showDateCheck').checked = true;
                
                updateFastPreview(); 
            }
        });

        // 長文を折り返して描画する関数
        function drawTextLines(ctx, text, x, startY, maxWidth, lineSpacing) {
            let currentY = startY;
            let paragraphs = text.split('\n');
            
            for (let para of paragraphs) {
                let words = para.split('');
                let line = '';
                
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n];
                    let testWidth = ctx.measureText(testLine).width;
                    
                    if (testWidth > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        line = words[n];
                        currentY += lineSpacing;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, currentY);
                currentY += lineSpacing;
            }
            return currentY;
        }

        // 入力変化時に裏側で静かに高解像度合成を行う関数
        function generateFinalCanvasSilently() {
            const img = new Image();
            img.onload = function() {
                let originalPhotoWidth = img.width;
                let srcX = 0;

                if (isEditMode) {
                    originalPhotoWidth = img.width / 1.35;
                    srcX = img.width - originalPhotoWidth;
                }

                const boardWidth = originalPhotoWidth * 0.35;
                
                canvas.width = boardWidth + originalPhotoWidth;
                canvas.height = img.height;

                ctx.fillStyle = "#004d25";
                ctx.fillRect(0, 0, boardWidth, canvas.height);

                ctx.drawImage(img, srcX, 0, originalPhotoWidth, img.height, boardWidth, 0, originalPhotoWidth, img.height);

                ctx.fillStyle = "#ffffff";
                const fontSize = boardWidth * 0.080;
                ctx.font = "bold " + fontSize + "px sans-serif";

                const lineSpacing = canvas.height * 0.040;  
                const itemSpacing = canvas.height * 0.040;  
                const maxTextWidth = boardWidth * 0.90;
                const textX = boardWidth * 0.05;
                let currentY = canvas.height * 0.05;

                ctx.fillText("撮影者：", textX, currentY);
                currentY += lineSpacing * 1.2;
                currentY = drawTextLines(ctx, document.getElementById('photographer').value, textX, currentY, maxTextWidth, lineSpacing);
                currentY += itemSpacing;

                ctx.fillText("物件略称：", textX, currentY);
                currentY += lineSpacing * 1.2;
                currentY = drawTextLines(ctx, document.getElementById('property').value, textX, currentY, maxTextWidth, lineSpacing);
                currentY += itemSpacing;

                ctx.fillText("撮影現場：", textX, currentY);
                currentY += lineSpacing * 1.2;
                currentY = drawTextLines(ctx, document.getElementById('location').value, textX, currentY, maxTextWidth, lineSpacing);
                currentY += itemSpacing;

                ctx.fillText("詳細：", textX, currentY);
                currentY += lineSpacing * 1.2;
                currentY = drawTextLines(ctx, document.getElementById('detail').value, textX, currentY, maxTextWidth, lineSpacing);

                if (document.getElementById('showDateCheck').checked && currentGeneratedDateText) {
                    ctx.fillText(currentGeneratedDateText, boardWidth - ctx.measureText(currentGeneratedDateText).width - (boardWidth * 0.05), canvas.height - (canvas.height * 0.03));
                }
            };
            img.src = currentOriginalImageSrc;
        }

        function setNewGenerationDate() {
            const now = new Date();
            currentGeneratedDateText = now.getFullYear() + '/' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                             String(now.getDate()).padStart(2, '0') + ' ' + 
                             String(now.getHours()).padStart(2, '0') + ':' + 
                             String(now.getMinutes()).padStart(2, '0');
        }

        okButton.addEventListener('click', function() {
            savePhotographer(document.getElementById('photographer').value); 
            saveCurrentInputs(); 
            isEditMode = false; 
            cameraInput.click();
        });

        editButton.addEventListener('click', function() {
            savePhotographer(document.getElementById('photographer').value); 
            saveCurrentInputs(); 
            isEditMode = true; 
            editFileInput.click();
        });

        cameraInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                setNewGenerationDate(); 
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentOriginalImageSrc = e.target.result;
                    previewPhoto.src = currentOriginalImageSrc; 
                    updateFastPreview(); 
                };
                reader.readAsDataURL(file);
            }
        });

        editFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                setNewGenerationDate(); 
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentOriginalImageSrc = e.target.result;
                    previewPhoto.src = currentOriginalImageSrc; 
                    updateFastPreview(); 
                };
                reader.readAsDataURL(file);
            }
        });
    </script>

</body>
</html>
