<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黒板カメラアプリ（左側黒板版）</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        #okButton { background-color: #007bff; }
        #editButton { background-color: #17a2b8; }
        #downloadButton { background-color: #28a745; display: none; }
        
        #resultContainer { margin-top: 20px; text-align: center; }
        #finalImage { max-width: 100%; height: auto; display: none; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>黒板カメラアプリ</h2>
    
    <div class="form-group">
        <label for="photographer">撮影者名</label>
        <input type="text" id="photographer" placeholder="例：○○株式会社 山田">
    </div>

    <div class="form-group">
        <label for="property">物件略称</label>
        <input type="text" id="property" placeholder="例：リバーライズ">
    </div>

    <div class="form-group">
        <label for="location">撮影現場</label>
        <input type="text" id="location" placeholder="例：2階 リビング">
    </div>

    <div class="form-group">
        <label for="detail">詳細</label>
        <input type="text" id="detail" placeholder="例：リモコン状況 寸法201×146 要交換">
    </div>

    <button id="okButton">OK（新規カメラ撮影）</button>
    <button id="editButton">編集（既存の画像を選択して黒板上書き）</button>
    <button id="downloadButton">この画像を端末に保存する</button>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="editFileInput" accept="image/*" style="display: none;">

    <div id="resultContainer">
        <p id="statusText"></p>
        <img id="finalImage" alt="完成写真">
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const okButton = document.getElementById('okButton');
        const editButton = document.getElementById('editButton');
        const downloadButton = document.getElementById('downloadButton');
        const cameraInput = document.getElementById('cameraInput');
        const editFileInput = document.getElementById('editFileInput');
        const finalImage = document.getElementById('finalImage');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let currentOriginalImageSrc = null;

        // 長文を幅に合わせて自動で改行しながら描画する関数
        function drawWrappedText(ctx, text, x, startY, maxWidth, lineSpacing) {
            let words = text.split('');
            let line = '';
            let currentY = startY;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n];
                    currentY += lineSpacing;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
            return currentY;
        }

        function drawBlackboard(imageSrc) {
            statusText.innerText = "画像を生成中...";
            const img = new Image();
            img.onload = function() {
                // ★【計算の変更】黒板の横幅を写真の横幅の「35%」の大きさに設定
                const boardWidth = img.width * 0.35;
                
                // キャンバス全体のサイズを「黒板の幅 + 写真の幅」にする（高さは写真に合わせる）
                canvas.width = boardWidth + img.width;
                canvas.height = img.height;

                // 1. 左側の領域を全面深緑色（黒板）で塗りつぶす
                ctx.fillStyle = "#004d25";
                ctx.fillRect(0, 0, boardWidth, canvas.height);

                // 2. 右側の領域に、写真を一切削らずにそのまま描画する
                ctx.drawImage(img, boardWidth, 0);

                // 3. 日付・時刻の取得
                const now = new Date();
                const dateText = now.getFullYear() + '/' + 
                                 String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                                 String(now.getDate()).padStart(2, '0') + ' ' + 
                                 String(now.getHours()).padStart(2, '0') + ':' + 
                                 String(now.getMinutes()).padStart(2, '0');

                // 4. 文字のデザイン設定（イメージ画像に合わせたフォントサイズに調整）
                ctx.fillStyle = "#ffffff";
                const fontSize = boardWidth * 0.055;
                ctx.font = "bold " + fontSize + "px sans-serif";

                // 各項目のテキスト作成
                const pName = "撮影者：\n" + document.getElementById('photographer').value;
                const pProp = "物件略称：\n" + document.getElementById('property').value;
                const pLoc  = "撮影現場：\n" + document.getElementById('location').value;
                const pDet  = "詳細：\n" + document.getElementById('detail').value;
                const pDate = dateText;

                // 文字を書き出す位置の設定
                const textX = boardWidth * 0.05;          // 黒板の左端から少し内側
                let currentY = canvas.height * 0.05;     // 黒板の上端からスタート
                const lineSpacing = canvas.height * 0.04;  // 行間（写真の高さに合わせてバランス調整）
                const maxTextWidth = boardWidth * 0.90;   // 折り返し幅

                // 5. 各項目を順番に描画（項目名と中身をスッキリ分けて改行連動）
                const items = [pName, pProp, pLoc, pDet];
                for(let item of items) {
                    let lines = item.split('\n');
                    // 「撮影者：」などの見出しを描画
                    ctx.fillText(lines[0], textX, currentY);
                    currentY += lineSpacing;
                    // 入力された中身を自動改行しながら描画
                    currentY = drawWrappedText(ctx, lines[1], textX, currentY, maxTextWidth, lineSpacing);
                    currentY += lineSpacing * 1.5; // 項目ごとの間隔を少しあける
                }

                // 6. 日付は一番右下にきれいに収まるように配置
                ctx.fillText(pDate, boardWidth - ctx.measureText(pDate).width - (boardWidth * 0.05), canvas.height - (canvas.height * 0.03));

                // 7. 完成した画像を画面に表示
                finalImage.src = canvas.toDataURL('image/jpeg');
                finalImage.style.display = 'block';
                downloadButton.style.display = 'block';
                statusText.innerText = "画像の生成が完了しました！";
            };
            img.src = imageSrc;
        }

        function checkInputs() {
            const photographer = document.getElementById('photographer').value;
            const property = document.getElementById('property').value;
            const location = document.getElementById('location').value;
            const detail = document.getElementById('detail').value;

            if (!photographer || !property || !location || !detail) {
                alert('すべての項目を入力してください！');
                return false;
            }
            return true;
        }

        okButton.addEventListener('click', function() {
            if (checkInputs()) {
                cameraInput.click();
            }
        });

        cameraInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentOriginalImageSrc = e.target.result;
                    drawBlackboard(currentOriginalImageSrc);
                };
                reader.readAsDataURL(file);
            }
        });

        editButton.addEventListener('click', function() {
            if (checkInputs()) {
                editFileInput.click();
            }
        });

        editFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentOriginalImageSrc = e.target.result;
                    drawBlackboard(currentOriginalImageSrc);
                };
                reader.readAsDataURL(file);
            }
        });

        downloadButton.addEventListener('click', function() {
            const link = document.createElement('a');
            const now = new Date();
            const fileName = "黒板写真_" + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + "_" + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0') + ".jpg";
            
            link.href = finalImage.src;
            link.download = fileName;
            link.click();
            
            alert('端末への保存命令を出しました！ダウンロードフォルダ等を確認してください。');
        });
    </script>

</body>
</html>
